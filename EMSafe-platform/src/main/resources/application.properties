# 🏷️ Nombre de la aplicación
spring.application.name=EMSafe-platform

# 🌐 Configuración de base de datos MySQL
#spring.datasource.url=jdbc:mysql://54.86.133.138:3306/emsafedb
spring.datasource.url=jdbc:mysql://35.172.16.160:3306/emsafedb
spring.datasource.username=shadowlopez
spring.datasource.password=Mmdr1982
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 🚪 Puerto del servidor (mantienes 9090 con HTTPS habilitado)
server.port=9090
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=emsafe
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=emsafe-cert

# 🧠 Configuración JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 🌱 Inicialización de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# 🕒 Formato y zona horaria
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# 📄 Documentación personalizada
documentation.application.version=0.0.1-SNAPSHOT
documentation.application.description=EMSafe backend platform

# 🪵 Logging para carga de datos
logging.level.org.springframework.jdbc.datasource.init=DEBUG
