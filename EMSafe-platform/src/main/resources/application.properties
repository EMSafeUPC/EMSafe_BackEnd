spring.application.name=EMSafe-platform

#spring.datasource.url=jdbc:mysql://54.86.133.138:3306/emsafedb
spring.datasource.url=jdbc:mysql://54.86.133.138:3306/emsafedb
spring.datasource.username=shadowlopez
spring.datasource.password=Mmdr1982
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Puerto del servidor
server.port=9090

# Configuración JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 🌱 Configuración para datos iniciales
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Configuración adicional para MySQL
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Documentación
documentation.application.version=0.0.1-SNAPSHOT
documentation.application.description=EMSafe backend platform

# Logging para verificar la carga de datos (opcional)
logging.level.org.springframework.jdbc.datasource.init=DEBUG


